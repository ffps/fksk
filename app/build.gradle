plugins {
    id 'com.android.application'
}

// Версия берётся из тега (задаёт GitHub Actions): v1.3.0 -> versionName 1.3.0, versionCode 10300.
// Без тега (локальная или промежуточная сборка) используется служебная версия.
def appVersionName = System.getenv('VERSION_NAME') ?: '0.0.0-dev'
def appVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.ffps.fksk'
    compileSdk 33

    defaultConfig {
        applicationId 'com.ffps.fksk'
        minSdk 17
        targetSdk 33
        versionCode appVersionCode
        versionName appVersionName
    }

    // Подпись берётся из переменных окружения (их задаёт GitHub Actions из секретов).
    // Без KEYSTORE_FILE release остаётся неподписанным, debug подписывается отладочным ключом.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
