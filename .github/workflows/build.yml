name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      # Постоянная подпись: если задан секрет KEYSTORE_BASE64, собираем release,
      # подписанный вашим ключом. Без секретов (например, в форках) — debug-сборка.
      - name: Prepare signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан: APK будет подписан временным отладочным ключом"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle ${{ steps.sign.outputs.task }} --no-daemon

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.sign.outputs.apk }}" | grep -E "certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ksk-apk
          path: ${{ steps.sign.outputs.apk }}

      # Имя файла: fKiosk-<тег без буквы v>.apk, например тег v1.1.2 -> fKiosk-1.1.2.apk
      - name: Rename APK for release
        id: release_apk
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="fKiosk-${VERSION}.apk"
          cp "${{ steps.sign.outputs.apk }}" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_apk.outputs.name }}
          generate_release_notes: true
